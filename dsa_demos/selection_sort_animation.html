<title>Selection Sort — Step by Step</title>
<script>
  (function() {
    try {
      var requestedTheme = new URLSearchParams(window.location.search).get('theme');
      var savedTheme = localStorage.getItem('site-theme');
      var theme = requestedTheme === 'dark' || requestedTheme === 'light' ? requestedTheme : savedTheme;
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (error) {
      document.documentElement.setAttribute('data-theme', 'dark');
      console.warn('Theme preference could not be loaded.', error);
    }
  }());
</script>

700;}

<body>
<div class="page-actions">
  <a class="icon-link" id="homeLink" href="../index.html" aria-label="Go to home page" title="Go to home page">⌂</a>
  <a class="icon-link" id="dsaLink" href="index.html" aria-label="Go to DSA page" title="Go to DSA page">≡</a>
</div>

<button class="theme-toggle" id="themeToggle" title="Switch theme">🌙</button>

<div class="layout">
  <div class="main-col">
    <h1>Selection Sort — Step by Step Animation</h1>
    <p class="subtitle">Sorting <span class="target-badge" id="arrayLabel">[29, 10, 14, 37, 13]</span> by scanning for the minimum value in the unsorted suffix and swapping it into position.</p>

    <div class="array-row" id="arrayRow"></div>

    <div class="legend">
      <span><span class="dot" style="background:var(--sorted)"></span> sorted prefix</span>
      <span><span class="dot" style="background:var(--current)"></span> current j</span>
      <span><span class="dot" style="background:var(--min)"></span> min_index</span>
    </div>

    <div class="panel">
      <div class="vars">
        <div class="var-box"><div class="val" id="iVal">0</div><div class="lbl">i</div></div>
        <div class="var-box"><div class="val" id="jVal">1</div><div class="lbl">j</div></div>
        <div class="var-box"><div class="val" id="minVal">0</div><div class="lbl">min_index</div></div>
      </div>
      <div class="explanation" id="explanation">Press <b>Play</b> to start the sort.</div>
    </div>

    <div class="controls">
      <button class="secondary" id="prevBtn">⬅ Prev</button>
      <button id="playBtn">▶ Play</button>
      <button id="nextBtn">Next ➡</button>
      <button class="secondary" id="resetBtn">⟲ Reset</button>
    </div>
  </div>

  <div class="code-col">
    <div class="code-box" id="codeBox"></div>
    <div class="trace-box" id="traceBox"></div>
  </div>
</div>

<script>
if (window.self !== window.top) {
  document.body.classList.add('embedded');
}

const startNumbers = [29, 10, 14, 37, 13];
document.getElementById('arrayLabel').textContent = `[${startNumbers.join(', ')}]`;

const arrayRow = document.getElementById('arrayRow');
startNumbers.forEach((_, index) => {
  const wrap = document.createElement('div');
  wrap.className = 'bar-wrap';
  wrap.innerHTML = `
    <div class="bar" id="bar-${index}"></div>
    <div class="bar-label" id="label-${index}"></div>
  `;
  arrayRow.appendChild(wrap);
});

const codeBox = document.getElementById('codeBox');

function formatRangeValues(start, endExclusive) {
  return `[${Array.from({ length: Math.max(endExclusive - start, 0) }, (_, index) => start + index).join(', ')}]`;
}

function formatCodeBool(result) {
  return `<span class="${result ? 'true' : 'false'}">${result ? 'True' : 'False'}</span>`;
}

function renderCode(step) {
  const outerRangeLimit = startNumbers.length - 1;
  const outerRange = formatRangeValues(0, outerRangeLimit);
  const activeI = step && step.i !== null ? step.i : 0;
  const innerRangeStart = activeI + 1;
  const innerRangeLimit = startNumbers.length;
  const innerRange = formatRangeValues(innerRangeStart, innerRangeLimit);
  const hasCompare = step && typeof step.compareCurrent === 'number' && typeof step.compareMin === 'number';
  const compareComment = hasCompare
    ? `# ${step.compareCurrent} &lt; ${step.compareMin} =&gt; ${formatCodeBool(step.compareCurrent < step.compareMin)}`
    : '# waiting for comparison';
  const updateComment = step && step.tags.includes('update')
    ? `# min_index = ${step.minIndex}`
    : '# waiting for update';
  const swapComment = step && step.tags.includes('swap')
    ? `# swap indices ${step.i} and ${step.minIndex} =&gt; [${step.arr.join(', ')}]`
    : '# before swapping';
  const codeLines = [
    {t:'numbers = [29, 10, 14, 37, 13]', tag:'setup'},
    {t:'n = len(numbers) <span class="cm"># total list elements</span>', tag:'init'},
    {t:`<span class="kw">for</span> i <span class="kw">in</span> range(n - 1): <span class="cm"># range(${outerRangeLimit}) =&gt; ${outerRange}</span>`, tag:'outer'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;min_index = i <span class="cm"># min_index = ${activeI}</span>`, tag:'mininit'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j <span class="kw">in</span> range(i + 1, n): <span class="cm"># range(${innerRangeStart}, ${innerRangeLimit}) =&gt; ${innerRange}</span>`, tag:'inner'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> numbers[j] &lt; numbers[min_index]: <span class="cm">${compareComment}</span>`, tag:'check'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;min_index = j <span class="cm">${updateComment}</span>`, tag:'update'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">${swapComment}</span>`, tag:'swap'},
    {t:'&nbsp;&nbsp;&nbsp;&nbsp;numbers[i], numbers[min_index] = numbers[min_index], numbers[i]', tag:'swap'},
    {t:'<span class="kw">print</span>(numbers)', tag:'print'}
  ];
  codeBox.innerHTML = codeLines.map((line) => `<span class="ln" data-tag="${line.tag}">${line.t}</span>`).join('');
}

function highlightCode(tags) {
  document.querySelectorAll('.code-box .ln').forEach((line) => {
    line.classList.toggle('active', tags.includes(line.dataset.tag));
  });
}

function buildSteps() {
  const arr = [...startNumbers];
  const n = arr.length;
  const steps = [];

  steps.push({
    arr: [...arr], i: 0, j: 1, minIndex: 0, sorted: [], current: null, swapping: [],
    text: `Start with the unsorted list <b>[${arr.join(', ')}]</b>. On each pass, Selection Sort finds the smallest remaining value.`,
    tags: ['setup', 'init'], cond: null
  });

  for (let i = 0; i < n - 1; i++) {
    let minIndex = i;
    steps.push({
      arr: [...arr], i, j: i + 1, minIndex, sorted: Array.from({ length: i }, (_, index) => index), current: null, swapping: [],
      text: `Pass <b>${i + 1}</b>: assume index <b>${i}</b> is the smallest so far, so <b>min_index = ${i}</b>.`,
      tags: ['outer', 'mininit'], cond: null
    });

    for (let j = i + 1; j < n; j++) {
      steps.push({
        arr: [...arr], i, j, minIndex, compareCurrent: arr[j], compareMin: arr[minIndex], sorted: Array.from({ length: i }, (_, index) => index), current: j, swapping: [],
        text: `Compare <b>arr[${j}] = ${arr[j]}</b> with the current minimum <b>arr[${minIndex}] = ${arr[minIndex]}</b>.`,
        tags: ['inner', 'check'],
        cond: `arr[${j}] < arr[${minIndex}]  →  ${arr[j]} < ${arr[minIndex]}  →  ${arr[j] < arr[minIndex] ? '<span class="true">True</span>' : '<span class="false">False</span>'}`
      });

      if (arr[j] < arr[minIndex]) {
        minIndex = j;
        steps.push({
          arr: [...arr], i, j, minIndex, compareCurrent: arr[j], compareMin: arr[minIndex], sorted: Array.from({ length: i }, (_, index) => index), current: j, swapping: [],
          text: `Update <b>min_index = ${j}</b> because <b>${arr[j]}</b> is the new smallest value seen in this pass.`,
          tags: ['check', 'update'],
          cond: `min_index = ${j}`
        });
      }
    }

    const left = arr[i];
    const right = arr[minIndex];
    arr[i] = right;
    arr[minIndex] = left;
    steps.push({
      arr: [...arr], i, j: null, minIndex, compareCurrent: right, compareMin: left, sorted: Array.from({ length: i }, (_, index) => index), current: null, swapping: [i, minIndex],
      text: `Swap <b>arr[${i}]</b> with <b>arr[${minIndex}]</b> so the smallest remaining value <b>${right}</b> moves into position ${i}.`,
      tags: ['swap'], cond: `swap indices ${i} and ${minIndex}  →  [${arr.join(', ')}]`
    });

    steps.push({
      arr: [...arr], i, j: null, minIndex: i, sorted: Array.from({ length: i + 1 }, (_, index) => index), current: null, swapping: [],
      text: `<span class="success">Index ${i} is now finalized. The sorted prefix grows to <b>[${arr.slice(0, i + 1).join(', ')}]</b>.</span>`,
      tags: ['outer'], cond: null
    });
  }

  steps.push({
    arr: [...arr], i: n - 1, j: null, minIndex: n - 1, sorted: arr.map((_, index) => index), current: null, swapping: [],
    text: `<span class="success">Done! The sorted list is <b>[${arr.join(', ')}]</b>, so print(numbers) shows the final result.</span>`,
    tags: ['print'], cond: null
  });

  return steps;
}

const steps = buildSteps();
let idx = 0;
let playing = false;
let timer = null;

function render() {
  const step = steps[idx];
  renderCode(step);
  document.getElementById('iVal').textContent = step.i !== null ? step.i : '-';
  document.getElementById('jVal').textContent = step.j !== null ? step.j : '-';
  document.getElementById('minVal').textContent = step.minIndex !== null ? step.minIndex : '-';
  document.getElementById('explanation').innerHTML = step.text;

  const condHtml = step.cond ? `<div class="tcond"><span class="tline">${step.cond}</span></div>` : '';
  document.getElementById('traceBox').innerHTML = `
    <span class="tline"><span class="tkey">arr</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; = [${step.arr.join(', ')}]</span>
    <span class="tline"><span class="tkey">n</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; = <span class="tval">${startNumbers.length}</span></span>
    <span class="tline"><span class="tkey">i</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; = <span class="tval">${step.i !== null ? step.i : '—'}</span></span>
    <span class="tline"><span class="tkey">j</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; = <span class="tval">${step.j !== null ? step.j : '—'}</span></span>
    <span class="tline"><span class="tkey">min_index</span> = <span class="tval">${step.minIndex !== null ? step.minIndex : '—'}</span></span>
    ${condHtml}
  `;

  const maxValue = Math.max(...startNumbers);
  const isMobile = window.innerWidth < 640;
  const baseHeight = isMobile ? 44 : 80;
  const heightRange = isMobile ? 70 : 120;
  step.arr.forEach((value, index) => {
    const bar = document.getElementById(`bar-${index}`);
    const label = document.getElementById(`label-${index}`);
    bar.className = 'bar';
    if (step.sorted.includes(index)) bar.classList.add('sorted');
    if (step.current === index) bar.classList.add('current');
    if (step.minIndex === index) bar.classList.add('min');
    if (step.swapping.includes(index)) bar.classList.add('swap');
    bar.style.height = `${baseHeight + (value / maxValue) * heightRange}px`;
    bar.textContent = value;

    const tags = [];
    if (step.i === index) tags.push('i');
    if (step.current === index) tags.push('j');
    if (step.minIndex === index) tags.push('min');
    if (step.sorted.includes(index)) tags.push('sorted');
    label.textContent = tags.join(' · ');
  });

  highlightCode(step.tags);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === steps.length - 1;
  if (idx === steps.length - 1) stopPlay();
}

function stopPlay() {
  playing = false;
  clearInterval(timer);
  document.getElementById('playBtn').textContent = '▶ Play';
}

function handleStepNavigationKey(event) {
  const target = event.target;
  if (target instanceof HTMLElement) {
    const tagName = target.tagName;
    if (target.isContentEditable || tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT') {
      return;
    }
  }

  if (event.key === 'ArrowRight' && idx < steps.length - 1) {
    event.preventDefault();
    idx += 1;
    render();
  } else if (event.key === 'ArrowLeft' && idx > 0) {
    event.preventDefault();
    idx -= 1;
    render();
  }
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if (idx < steps.length - 1) { idx += 1; render(); }
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (idx > 0) { idx -= 1; render(); }
});
document.getElementById('resetBtn').addEventListener('click', () => {
  stopPlay(); idx = 0; render();
});
document.getElementById('playBtn').addEventListener('click', () => {
  if (playing) { stopPlay(); return; }
  if (idx === steps.length - 1) idx = 0;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ Pause';
  timer = setInterval(() => {
    if (idx < steps.length - 1) { idx += 1; render(); }
    else stopPlay();
  }, 1700);
});
document.addEventListener('keydown', handleStepNavigationKey);
window.addEventListener('resize', () => { render(); });

render();

const themeToggle = document.getElementById('themeToggle');
const homeLink = document.getElementById('homeLink');
const dsaLink = document.getElementById('dsaLink');

function syncNavLinks(theme) {
  homeLink.setAttribute('href', `../index.html?theme=${encodeURIComponent(theme)}`);
  dsaLink.setAttribute('href', `index.html?demo=selection&theme=${encodeURIComponent(theme)}`);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('site-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  themeToggle.title = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  themeToggle.setAttribute('aria-label', themeToggle.title);
  syncNavLinks(theme);
}

applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
themeToggle.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
