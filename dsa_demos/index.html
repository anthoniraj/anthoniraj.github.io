<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Structure and Algorithms</title>
<script>
  (function() {
    try {
      var urlTheme = new URLSearchParams(window.location.search).get('theme');
      var savedTheme = localStorage.getItem('site-theme');
      var theme = urlTheme === 'dark' || urlTheme === 'light' ? urlTheme : savedTheme;
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (error) {
      console.warn('Theme preference could not be loaded.', error);
    }
  }());
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --text: #1e2b37;
    --muted: #64748b;
    --primary: #0f172a;
    --secondary: #0284c7;
    --border: #cbd5e1;
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    --soft-fill: #eff6ff;
    --scrollbar-track: #e2e8f0;
    --scrollbar-thumb: #94a3b8;
    --scrollbar-thumb-hover: #64748b;
    --header-height: 56px;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #020617;
    --panel: #0f172a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --primary: #f8fafc;
    --secondary: #38bdf8;
    --border: #334155;
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    --soft-fill: #082f49;
    --scrollbar-track: #0b1220;
    --scrollbar-thumb: #475569;
    --scrollbar-thumb-hover: #64748b;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  }

  *::-webkit-scrollbar {
    width: 12px;
    height: 12px;
  }

  *::-webkit-scrollbar-track {
    background: var(--scrollbar-track);
  }

  *::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 999px;
    border: 3px solid var(--scrollbar-track);
  }

  *::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-thumb-hover);
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s ease, color 0.25s ease;
  }

  .page-shell {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin: 0;
    min-height: var(--header-height);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 30;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
  }

  .sidebar-link,
  .icon-link,
  .fullscreen-toggle {
    text-decoration: none;
  }

  .topbar-title {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .topbar-title strong {
    font-size: 1rem;
    font-weight: 700;
  }

  .topbar-title span {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .toc-toggle,
  .theme-toggle,
  .icon-link,
  .fullscreen-toggle {
    min-width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--primary);
    font-size: 1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 0.7rem;
  }

  .toc-toggle {
    min-width: auto;
    height: 36px;
    font-size: 0.94rem;
  }

  .toc-toggle {
    gap: 0.45rem;
    font-weight: 600;
    border-color: var(--secondary);
    color: var(--secondary);
    background: var(--soft-fill);
  }

  h1, h2 {
    font-family: "Inter", sans-serif;
    margin: 0;
  }

  h1 {
    font-size: 1.15rem;
    color: var(--primary);
    margin-bottom: 0.25rem;
  }

  .workspace {
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr);
    gap: 0;
    align-items: stretch;
    min-height: calc(100vh - var(--header-height));
  }

  .workspace.sidebar-hidden {
    grid-template-columns: 1fr;
  }

  .workspace.sidebar-hidden .sidebar {
    display: none;
  }

  .sidebar,
  .demo-stage {
    background: var(--panel);
    border: 0;
    border-radius: 0;
  }

  .sidebar {
    padding: 18px 16px;
    position: sticky;
    top: var(--header-height);
    min-height: calc(100vh - var(--header-height));
    max-height: calc(100vh - var(--header-height));
    overflow: auto;
    border-right: 1px solid var(--border);
  }

  .sidebar-header {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 0.9rem;
  }

  .sidebar-header small {
    color: var(--muted);
    font-size: 0.86rem;
  }

  .sidebar h2 {
    font-family: "Inter", sans-serif;
    color: var(--primary);
    margin: 0;
  }

  .sidebar h2 {
    font-size: 1.45rem;
    margin-bottom: 0.75rem;
  }

  .sidebar p,
  .demo-head p {
    color: var(--muted);
    line-height: 1.7;
    margin: 0;
  }

  .toc {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    margin: 1rem 0;
  }

  .toc-group {
    border: 0;
    border-radius: 0;
    overflow: visible;
    background: transparent;
  }

  .toc-group summary {
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.75rem;
    padding: 0.48rem 0.6rem 0.48rem 1.7rem;
    cursor: pointer;
    color: var(--primary);
    font-size: 0.92rem;
    font-weight: 700;
    user-select: none;
    border-radius: 8px;
    position: relative;
  }

  .toc-group summary::-webkit-details-marker {
    display: none;
  }

  .toc-group summary::after {
    content: "▸";
    color: var(--secondary);
    font-size: 0.92rem;
    line-height: 1;
    position: absolute;
    left: 0.55rem;
  }

  .toc-group[open] summary {
    background: var(--soft-fill);
  }

  .toc-group[open] summary::after {
    content: "▾";
  }

  .toc-children {
    display: flex;
    flex-direction: column;
    gap: 0.12rem;
    padding: 0.15rem 0 0.2rem 0.95rem;
    margin-left: 0.8rem;
    border-left: 1px solid var(--border);
  }

  .toc-label {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0;
    border-radius: 0;
    background: transparent;
    color: var(--secondary);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 1rem;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.44rem 0.55rem 0.44rem 1.55rem;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    position: relative;
  }

  .sidebar-link::before {
    content: "";
    position: absolute;
    left: 0.7rem;
    top: 50%;
    width: auto;
    height: auto;
    border-radius: 0;
    background: transparent;
    color: var(--secondary);
    content: "•";
    transform: translateY(-50%);
    opacity: 0.8;
    font-size: 0.9rem;
    line-height: 1;
  }

  .sidebar-link:hover,
  .sidebar-link.active {
    border-color: var(--secondary);
    background: var(--soft-fill);
  }

  .sidebar-link strong {
    display: inline-block;
    font-weight: 600;
    color: var(--primary);
    margin: 0;
  }

  .sidebar-link span {
    flex: 0 0 auto;
    font-size: 0.68rem;
    line-height: 1;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.22rem 0.4rem;
    white-space: nowrap;
  }

  .sidebar-note {
    padding: 0.65rem 0.75rem;
    border-radius: 8px;
    background: transparent;
    border: 1px dashed var(--border);
    font-size: 0.84rem;
    margin-left: 0.35rem;
  }

  .demo-stage {
    padding: 10px;
    min-height: calc(100vh - var(--header-height));
    display: flex;
    flex-direction: column;
  }

  .frame-shell {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--panel);
    flex: 1;
    min-height: calc(100vh - 96px);
  }

  .frame-shell:fullscreen {
    border-radius: 0;
    border: 0;
  }

  .frame-shell:fullscreen iframe {
    min-height: 100vh;
  }

  iframe {
    display: block;
    width: 100%;
    height: 100%;
    min-height: calc(100vh - 96px);
    border: 0;
    background: transparent;
  }

  @media (max-width: 980px) {
    .workspace {
      grid-template-columns: 1fr;
      min-height: auto;
    }
    .sidebar {
      position: static;
      min-height: 0;
      max-height: none;
      overflow: auto;
      border-right: 0;
      border-bottom: 1px solid var(--border);
      display: none;
    }
    .sidebar.open { display: block; }
    .demo-stage {
      min-height: auto;
    }
    .frame-shell,
    iframe {
      min-height: 760px;
    }
  }

  @media (max-width: 700px) {
    .topbar {
      padding: 8px 10px;
      gap: 0.6rem;
    }
    .topbar-title span {
      display: none;
    }
    .topbar-actions {
      gap: 0.5rem;
    }
    iframe {
      min-height: 680px;
    }
  }
</style>
</head>
<body>
  <div class="page-shell">
    <div class="topbar">
      <div class="topbar-actions">
        <button class="toc-toggle" id="tocToggle" aria-controls="tocSidebar" aria-expanded="true">☰ <span>Contents</span></button>
        <div class="topbar-title">
          <strong id="headerTitle">Data Structure and Algorithms</strong>
          <span id="headerSubtitle">Linear Search</span>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="icon-link" id="homeIconLink" href="../index.html" aria-label="Go to home page" title="Go to home page">🏠</a>
        <button class="fullscreen-toggle" id="fullscreenToggle" aria-label="Toggle fullscreen" title="Toggle fullscreen">⛶</button>
        <button class="theme-toggle" id="themeToggle" aria-label="Switch theme" title="Switch theme">🌙</button>
      </div>
    </div>

    <section class="workspace">
      <aside class="sidebar" id="tocSidebar">
        <div class="sidebar-header">
          <small>Choose a topic from the tree menu.</small>
        </div>
        <div class="toc-label">Demo Contents</div>

        <nav class="toc" id="tocNav">
          <details class="toc-group" open>
            <summary>Complexity Basics</summary>
            <div class="toc-children">
              <a class="sidebar-link" href="space_complexity.html" data-demo="space" data-title="Space Complexity" data-description="A simple explanation of how much extra memory an algorithm uses.">
                <strong>Space Complexity</strong>
                <span>Guide</span>
              </a>
              <a class="sidebar-link" href="time_complexity.html" data-demo="time" data-title="Time Complexity" data-description="A simple explanation of how the amount of work grows as input grows.">
                <strong>Time Complexity</strong>
                <span>Guide</span>
              </a>
            </div>
          </details>

          <details class="toc-group" open>
            <summary>Searching</summary>
            <div class="toc-children">
              <a class="sidebar-link active" href="linear_search_animation.html" data-demo="linear" data-title="Linear Search" data-description="Sequential search animation with index-by-index tracing.">
                <strong>Linear Search</strong>
                <span>O(n)</span>
              </a>
              <a class="sidebar-link" href="binary_search_animation.html" data-demo="binary" data-title="Binary Search" data-description="Sorted-array search that halves the active range each step.">
                <strong>Binary Search</strong>
                <span>O(log n)</span>
              </a>
            </div>
          </details>

          <details class="toc-group" open>
            <summary>Sorting</summary>
            <div class="toc-children">
              <a class="sidebar-link" href="bubble_sort_animation.html" data-demo="bubble" data-title="Bubble Sort" data-description="Adjacent comparisons that bubble larger values toward the end.">
                <strong>Bubble Sort</strong>
                <span>O(n²)</span>
              </a>
              <a class="sidebar-link" href="selection_sort_animation.html" data-demo="selection" data-title="Selection Sort" data-description="Repeatedly select the minimum item and place it at the front.">
                <strong>Selection Sort</strong>
                <span>O(n²)</span>
              </a>
              <a class="sidebar-link" href="insertion_sort_animation.html" data-demo="insertion" data-title="Insertion Sort" data-description="Build a sorted prefix by inserting each value into place.">
                <strong>Insertion Sort</strong>
                <span>O(n²)</span>
              </a>
            </div>
          </details>
        </nav>
      </aside>

      <div class="demo-stage">
        <div class="frame-shell">
          <iframe id="demoFrame" src="linear_search_animation.html" title="DSA demo viewer" loading="lazy"></iframe>
        </div>
      </div>
    </section>
  </div>

<script>
  const tocToggle = document.getElementById('tocToggle');
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  const themeToggle = document.getElementById('themeToggle');
  const workspace = document.querySelector('.workspace');
  const tocSidebar = document.getElementById('tocSidebar');
  const headerTitle = document.getElementById('headerTitle');
  const headerSubtitle = document.getElementById('headerSubtitle');
  const homeIconLink = document.getElementById('homeIconLink');
  const demoFrame = document.getElementById('demoFrame');
  const frameShell = document.querySelector('.frame-shell');
  const tocLinks = Array.from(document.querySelectorAll('.sidebar-link'));
  const tocGroups = Array.from(document.querySelectorAll('.toc-group'));

  const demos = {
    space: {
      file: 'space_complexity.html',
      title: 'Space Complexity',
      description: 'A simple explanation of how much extra memory an algorithm uses.'
    },
    time: {
      file: 'time_complexity.html',
      title: 'Time Complexity',
      description: 'A simple explanation of how the amount of work grows as input grows.'
    },
    linear: {
      file: 'linear_search_animation.html',
      title: 'Linear Search',
      description: 'Sequential search animation with index-by-index tracing.'
    },
    binary: {
      file: 'binary_search_animation.html',
      title: 'Binary Search',
      description: 'Sorted-array search that halves the active range each step.'
    },
    bubble: {
      file: 'bubble_sort_animation.html',
      title: 'Bubble Sort',
      description: 'Adjacent comparisons that bubble larger values toward the end.'
    },
    selection: {
      file: 'selection_sort_animation.html',
      title: 'Selection Sort',
      description: 'Repeatedly select the minimum item and place it at the front.'
    },
    insertion: {
      file: 'insertion_sort_animation.html',
      title: 'Insertion Sort',
      description: 'Build a sorted prefix by inserting each value into place.'
    }
  };

  function getActiveTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function buildThemeHref(path) {
    return path + '?theme=' + encodeURIComponent(getActiveTheme());
  }

  function setHomeLinks() {
    const themedHome = buildThemeHref('../index.html');
    homeIconLink.setAttribute('href', themedHome);
  }

  function setActiveLink(demoKey) {
    tocLinks.forEach((link) => {
      link.classList.toggle('active', link.dataset.demo === demoKey);
    });

    tocGroups.forEach((group) => {
      group.open = true;
    });
  }

  function loadDemo(demoKey, pushState) {
    const selected = demos[demoKey] || demos.linear;
    headerTitle.textContent = 'Data Structure and Algorithms';
    headerSubtitle.textContent = selected.title;
    const themedDemoHref = buildThemeHref(selected.file);
    demoFrame.setAttribute('src', themedDemoHref);
    setActiveLink(demoKey in demos ? demoKey : 'linear');

    if (pushState) {
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set('demo', demoKey in demos ? demoKey : 'linear');
      nextUrl.searchParams.set('theme', getActiveTheme());
      window.history.replaceState({}, '', nextUrl);
    }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('site-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    themeToggle.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    setHomeLinks();
    const activeKey = new URLSearchParams(window.location.search).get('demo') || 'linear';
    loadDemo(activeKey, true);
  }

  const requestedTheme = new URLSearchParams(window.location.search).get('theme');
  const initialTheme = requestedTheme === 'dark' || requestedTheme === 'light'
    ? requestedTheme
    : (localStorage.getItem('site-theme') === 'dark' ? 'dark' : 'light');
  applyTheme(initialTheme);

  const initialDemo = new URLSearchParams(window.location.search).get('demo') || 'linear';
  loadDemo(initialDemo, true);

  tocLinks.forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      loadDemo(link.dataset.demo || 'linear', true);
      if (window.innerWidth <= 980) {
        tocSidebar.classList.remove('open');
        tocToggle.setAttribute('aria-expanded', 'false');
      }
    });
  });

  tocToggle.addEventListener('click', () => {
    const isOpen = tocSidebar.classList.toggle('open');
    workspace.classList.toggle('sidebar-hidden', !isOpen);
    tocToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  function syncTocState() {
    const shouldOpen = window.innerWidth > 980;
    tocSidebar.classList.toggle('open', shouldOpen);
    workspace.classList.toggle('sidebar-hidden', !shouldOpen);
    tocToggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
  }

  syncTocState();
  window.addEventListener('resize', () => {
    if (window.innerWidth > 980) {
      tocSidebar.classList.add('open');
      workspace.classList.remove('sidebar-hidden');
      tocToggle.setAttribute('aria-expanded', 'true');
    }
  });

  fullscreenToggle.addEventListener('click', async () => {
    if (!document.fullscreenElement) {
      await frameShell.requestFullscreen();
      fullscreenToggle.textContent = '🡼';
      fullscreenToggle.title = 'Exit fullscreen';
      fullscreenToggle.setAttribute('aria-label', 'Exit fullscreen');
      return;
    }

    await document.exitFullscreen();
  });

  document.addEventListener('fullscreenchange', () => {
    const isFullscreen = Boolean(document.fullscreenElement);
    fullscreenToggle.textContent = isFullscreen ? '🡼' : '⛶';
    fullscreenToggle.title = isFullscreen ? 'Exit fullscreen' : 'Toggle fullscreen';
    fullscreenToggle.setAttribute('aria-label', fullscreenToggle.title);
  });

  themeToggle.addEventListener('click', () => {
    applyTheme(getActiveTheme() === 'dark' ? 'light' : 'dark');
  });
</script>
</body>
</html>
