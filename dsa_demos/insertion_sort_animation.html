    try {
      var requestedTheme = new URLSearchParams(window.location.search).get('theme');
      var savedTheme = localStorage.getItem('site-theme');
      var theme = requestedTheme === 'dark' || requestedTheme === 'light' ? requestedTheme : savedTheme;
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (error) {
      document.documentElement.setAttribute('data-theme', 'dark');
      console.warn('Theme preference could not be loaded.', error);
    }
  }());

font-weight:700;}

<body>
<div class="page-actions">
  <a class="icon-link" id="homeLink" href="../index.html" aria-label="Go to home page" title="Go to home page">⌂</a>
  <a class="icon-link" id="dsaLink" href="index.html" aria-label="Go to DSA page" title="Go to DSA page">≡</a>
</div>

<button class="theme-toggle" id="themeToggle" title="Switch theme">🌙</button>

<div class="layout">
  <div class="main-col">
    <h1>Insertion Sort — Step by Step Animation</h1>
    <p class="subtitle">Sorting <input type="text" id="arrayInput" class="array-input" value="[7, 3, 9, 1]" title="Edit list numbers (comma-separated, min 4 to max 10 values)" aria-label="List numbers to sort"> by taking one key at a time and inserting it into the correct spot in the sorted left side.</p>

    <div class="array-row" id="arrayRow"></div>

    <div class="legend">
      <span><span class="dot" style="background:var(--sorted)"></span> sorted prefix</span>
      <span><span class="dot" style="background:var(--key)"></span> key</span>
      <span><span class="dot" style="background:var(--shift)"></span> shifting right</span>
    </div>

    <div class="panel">
      <div class="vars">
        <div class="var-box"><div class="val" id="iVal">1</div><div class="lbl">i</div></div>
        <div class="var-box"><div class="val" id="keyVal">3</div><div class="lbl">key</div></div>
        <div class="var-box"><div class="val" id="jVal">0</div><div class="lbl">j</div></div>
      </div>
      <div class="explanation" id="explanation">Press <b>Play</b> to start the sort.</div>
    </div>

    <div class="controls">
      <button class="secondary" id="prevBtn">⬅ Prev</button>
      <button id="playBtn">▶ Play</button>
      <button id="nextBtn">Next ➡</button>
      <button class="secondary" id="resetBtn">⟲ Reset</button>
    </div>
  </div>

  <div class="code-col">
    <div class="code-box" id="codeBox"></div>
    <div class="trace-box" id="traceBox"></div>
  </div>
</div>

<script>
if (window.self !== window.top) {
  document.body.classList.add('embedded');
}

let startNumbers = [7, 3, 9, 1];
const arrayInput = document.getElementById('arrayInput');
const arrayRow = document.getElementById('arrayRow');

function initBars() {
  arrayRow.innerHTML = '';
  arrayRow.classList.toggle('dense', startNumbers.length > 6);
  startNumbers.forEach((_, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    wrap.innerHTML = `
      <div class="bar" id="bar-${index}"></div>
      <div class="bar-label" id="label-${index}"></div>
    `;
    arrayRow.appendChild(wrap);
  });
}
initBars();

const codeBox = document.getElementById('codeBox');

function formatRangeValues(start, endExclusive) {
  return `[${Array.from({ length: Math.max(endExclusive - start, 0) }, (_, index) => start + index).join(', ')}]`;
}

function formatCodeBool(result) {
  return `<span class="${result ? 'true' : 'false'}">${result ? 'True' : 'False'}</span>`;
}

function renderCode(step) {
  const outerRangeStart = 1;
  const outerRangeLimit = startNumbers.length;
  const outerRange = formatRangeValues(outerRangeStart, outerRangeLimit);
  const activeI = step && step.i !== null ? step.i : 1;
  const keyValue = step && step.key !== null ? step.key : (startNumbers.length > 1 ? startNumbers[1] : startNumbers[0]);
  const activeJ = step && step.j !== null ? step.j : activeI - 1;
  const hasComparable = step && step.j !== null && step.j >= 0 && step.j < step.arr.length;
  const whileComment = step
    ? hasComparable
      ? `# ${activeJ} >= 0 and ${step.arr[activeJ]} &gt; ${keyValue} =&gt; ${formatCodeBool(step.arr[activeJ] > keyValue)}`
      : `# ${activeJ} >= 0 =&gt; ${formatCodeBool(activeJ >= 0)}`
    : '# waiting for comparison';
  const shiftComment = step && step.tags.includes('shift') && step.shiftIndex !== null && step.j !== null
    ? `# arr[${step.shiftIndex}] = ${step.arr[step.shiftIndex]} =&gt; [${step.arr.join(', ')}]`
    : '# waiting for shift';
  const decrementComment = step && step.tags.includes('decrement') && step.j !== null
    ? `# next j = ${step.j - 1}`
    : '# waiting for decrement';
  const insertComment = step && step.tags.includes('insert') && step.keyIndex !== null
    ? step.arr[step.keyIndex] === step.key
      ? `# arr[${step.keyIndex}] = ${step.key} =&gt; [${step.arr.join(', ')}]`
      : `# insert at index ${step.keyIndex}`
    : '# waiting for insert';
  const codeLines = [
    {t:`numbers = [${startNumbers.join(', ')}]`, tag:'setup'},
    {t:`<span class="kw">for</span> i <span class="kw">in</span> range(1, len(numbers)): <span class="cm"># range(${outerRangeStart}, ${outerRangeLimit}) =&gt; ${outerRange}</span>`, tag:'outer'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;key = numbers[i] <span class="cm"># key = ${keyValue}</span>`, tag:'key'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;j = i - 1 <span class="cm"># j = ${activeJ}</span>`, tag:'jinit'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">while</span> j &gt;= 0 and numbers[j] &gt; key: <span class="cm">${whileComment}</span>`, tag:'while'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;numbers[j + 1] = numbers[j] <span class="cm">${shiftComment}</span>`, tag:'shift'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;j -= 1 <span class="cm">${decrementComment}</span>`, tag:'decrement'},
    {t:`&nbsp;&nbsp;&nbsp;&nbsp;numbers[j + 1] = key <span class="cm">${insertComment}</span>`, tag:'insert'},
    {t:'<span class="kw">print</span>(numbers)', tag:'print'}
  ];
  codeBox.innerHTML = codeLines.map((line) => `<span class="ln" data-tag="${line.tag}">${line.t}</span>`).join('');
}

function highlightCode(tags) {
  document.querySelectorAll('.code-box .ln').forEach((line) => {
    line.classList.toggle('active', tags.includes(line.dataset.tag));
  });
}

function buildSteps() {
  const arr = [...startNumbers];
  const steps = [];

  steps.push({
    arr: [...arr], i: 1, j: 0, key: arr[1], sorted: [0], keyIndex: 1, shiftIndex: null,
    text: `Start with the list <b>[${arr.join(', ')}]</b>. The first element is treated as a sorted prefix of length 1.`,
    tags: ['setup'], cond: null
  });

  for (let i = 1; i < arr.length; i++) {
    const key = arr[i];
    let j = i - 1;
    steps.push({
      arr: [...arr], i, j, key, sorted: Array.from({ length: i }, (_, index) => index), keyIndex: i, shiftIndex: null,
      text: `Take <b>key = arr[${i}] = ${key}</b>. We will slide larger values right until the key can be inserted.`,
      tags: ['outer', 'key', 'jinit'], cond: null
    });

    while (j >= 0 && arr[j] > key) {
      steps.push({
        arr: [...arr], i, j, key, sorted: Array.from({ length: i }, (_, index) => index), keyIndex: i, shiftIndex: j,
        text: `Compare <b>arr[${j}] = ${arr[j]}</b> with <b>key = ${key}</b>. Since ${arr[j]} is larger, shift it one position to the right.`,
        tags: ['while', 'shift'],
        cond: `j >= 0 and arr[${j}] > key  →  ${j} >= 0 and ${arr[j]} > ${key}  →  <span class="true">True</span>`
      });

      arr[j + 1] = arr[j];
      steps.push({
        arr: [...arr], i, j, key, sorted: Array.from({ length: i }, (_, index) => index), keyIndex: j, shiftIndex: j + 1,
        text: `Shift complete: copy <b>${arr[j]}</b> into index <b>${j + 1}</b>. The gap for the key moves left.`,
        tags: ['shift', 'decrement'], cond: `arr[${j + 1}] = arr[${j}]  →  [${arr.join(', ')}]`
      });
      j -= 1;
    }

    steps.push({
      arr: [...arr], i, j, key, sorted: Array.from({ length: i }, (_, index) => index), keyIndex: j + 1, shiftIndex: null,
      text: `Now insert <b>key = ${key}</b> at index <b>${j + 1}</b>. Everything to its left is smaller or equal.`,
      tags: ['insert'],
      cond: `next insert position = ${j + 1}`
    });
    arr[j + 1] = key;

    steps.push({
      arr: [...arr], i, j, key, sorted: Array.from({ length: i + 1 }, (_, index) => index), keyIndex: j + 1, shiftIndex: null,
      text: `<span class="success">After inserting ${key}, the sorted prefix becomes <b>[${arr.slice(0, i + 1).join(', ')}]</b>.</span>`,
      tags: ['insert'], cond: `arr[${j + 1}] = key  →  [${arr.join(', ')}]`
    });
  }

  steps.push({
    arr: [...arr], i: arr.length - 1, j: 0, key: arr[arr.length - 1], sorted: arr.map((_, index) => index), keyIndex: null, shiftIndex: null,
    text: `<span class="success">Done! The sorted list is <b>[${arr.join(', ')}]</b>, so print(numbers) shows the final order.</span>`,
    tags: ['print'], cond: null
  });

  return steps;
}

let steps = buildSteps();
let idx = 0;
let playing = false;
let timer = null;

function render() {
  const step = steps[idx];
  renderCode(step);
  document.getElementById('iVal').textContent = step.i !== null ? step.i : '-';
  document.getElementById('jVal').textContent = step.j !== null ? step.j : '-';
  document.getElementById('keyVal').textContent = step.key !== null ? step.key : '-';
  document.getElementById('explanation').innerHTML = step.text;

  const condHtml = step.cond ? `<div class="tcond"><span class="tline">${step.cond}</span></div>` : '';
  document.getElementById('traceBox').innerHTML = `
    <span class="tline"><span class="tkey">arr</span>&nbsp;&nbsp; = [${step.arr.join(', ')}]</span>
    <span class="tline"><span class="tkey">i</span>&nbsp;&nbsp;&nbsp;&nbsp; = <span class="tval">${step.i !== null ? step.i : '—'}</span></span>
    <span class="tline"><span class="tkey">j</span>&nbsp;&nbsp;&nbsp;&nbsp; = <span class="tval">${step.j !== null ? step.j : '—'}</span></span>
    <span class="tline"><span class="tkey">key</span>&nbsp;&nbsp; = <span class="tval">${step.key !== null ? step.key : '—'}</span></span>
    ${condHtml}
  `;

  const maxValue = Math.max(...startNumbers.map(v => Math.abs(v)), 1);
  const isMobile = window.innerWidth < 640;
  const baseHeight = isMobile ? 44 : 80;
  const heightRange = isMobile ? 70 : 120;
  step.arr.forEach((value, index) => {
    const bar = document.getElementById(`bar-${index}`);
    const label = document.getElementById(`label-${index}`);
    if (!bar || !label) return;
    bar.className = 'bar';
    if (step.sorted.includes(index)) bar.classList.add('sorted');
    if (step.keyIndex === index) bar.classList.add('key');
    if (step.shiftIndex === index) bar.classList.add('shift');
    bar.style.height = `${Math.max(isMobile ? 24 : 36, baseHeight + (value / maxValue) * heightRange)}px`;
    bar.textContent = value;

    const tags = [];
    if (step.i === index) tags.push('i');
    if (step.j === index) tags.push('j');
    if (step.keyIndex === index) tags.push('key');
    if (step.sorted.includes(index)) tags.push('sorted');
    label.textContent = tags.join(' · ');
  });

  highlightCode(step.tags);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === steps.length - 1;
  if (idx === steps.length - 1) stopPlay();
}

function stopPlay() {
  playing = false;
  clearInterval(timer);
  document.getElementById('playBtn').textContent = '▶ Play';
}

function handleStepNavigationKey(event) {
  const target = event.target;
  if (target instanceof HTMLElement) {
    const tagName = target.tagName;
    if (target.isContentEditable || tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT') {
      return;
    }
  }

  if (event.key === 'ArrowRight' && idx < steps.length - 1) {
    event.preventDefault();
    idx += 1;
    render();
  } else if (event.key === 'ArrowLeft' && idx > 0) {
    event.preventDefault();
    idx -= 1;
    render();
  }
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if (idx < steps.length - 1) { idx += 1; render(); }
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (idx > 0) { idx -= 1; render(); }
});
document.getElementById('resetBtn').addEventListener('click', () => {
  stopPlay(); idx = 0; render();
});
document.getElementById('playBtn').addEventListener('click', () => {
  if (playing) { stopPlay(); return; }
  if (idx === steps.length - 1) idx = 0;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ Pause';
  timer = setInterval(() => {
    if (idx < steps.length - 1) { idx += 1; render(); }
    else stopPlay();
  }, 1700);
});
function showListWarning(message) {
  if (typeof Swal !== 'undefined') {
    const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    Swal.fire({
      icon: 'warning',
      title: 'List Size Limit',
      text: message,
      confirmButtonText: 'OK',
      confirmButtonColor: '#0284c7',
      background: isDark ? '#1e293b' : '#ffffff',
      color: isDark ? '#e2e8f0' : '#1e293b'
    });
  } else {
    alert(message);
  }
}

function getRawNumbers(val) {
  if (!val) return [];
  const matches = val.match(/-?\d+/g);
  if (!matches) return [];
  return matches.map(n => parseInt(n, 10)).filter(n => Number.isInteger(n) && !isNaN(n));
}

function updateArray(newNumbers) {
  startNumbers = newNumbers;
  initBars();
  stopPlay();
  steps = buildSteps();
  idx = 0;
  render();
}

let limitAlertShown = false;

if (arrayInput) {
  arrayInput.addEventListener('input', () => {
    const raw = getRawNumbers(arrayInput.value);
    if (raw.length >= 4 && raw.length <= 10) {
      limitAlertShown = false;
      arrayInput.classList.remove('invalid');
      updateArray(raw);
    } else {
      arrayInput.classList.add('invalid');
      if (raw.length > 10 && !limitAlertShown) {
        limitAlertShown = true;
        showListWarning(`Maximum 10 numbers allowed in the list (you entered ${raw.length}). Please enter between 4 and 10 numbers.`);
      } else if (raw.length <= 10) {
        limitAlertShown = false;
      }
    }
  });

  arrayInput.addEventListener('change', () => {
    const raw = getRawNumbers(arrayInput.value);
    if (raw.length < 4) {
      showListWarning(`Minimum 4 numbers required (you entered ${raw.length}). Please enter between 4 and 10 numbers.`);
      arrayInput.classList.remove('invalid');
      arrayInput.value = `[${startNumbers.join(', ')}]`;
      limitAlertShown = false;
    } else if (raw.length > 10) {
      showListWarning(`Maximum 10 numbers allowed in the list (you entered ${raw.length}). Please enter between 4 and 10 numbers.`);
      arrayInput.classList.remove('invalid');
      arrayInput.value = `[${startNumbers.join(', ')}]`;
      limitAlertShown = false;
    } else {
      arrayInput.classList.remove('invalid');
      startNumbers = raw;
      arrayInput.value = `[${startNumbers.join(', ')}]`;
      updateArray(startNumbers);
      limitAlertShown = false;
    }
  });

  arrayInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      arrayInput.blur();
    }
  });
}

document.addEventListener('keydown', handleStepNavigationKey);
window.addEventListener('resize', () => { render(); });

render();

const themeToggle = document.getElementById('themeToggle');
const homeLink = document.getElementById('homeLink');
const dsaLink = document.getElementById('dsaLink');

function syncNavLinks(theme) {
  homeLink.setAttribute('href', `../index.html?theme=${encodeURIComponent(theme)}`);
  dsaLink.setAttribute('href', `index.html?demo=insertion&theme=${encodeURIComponent(theme)}`);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('site-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  themeToggle.title = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  themeToggle.setAttribute('aria-label', themeToggle.title);
  syncNavLinks(theme);
}

applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
themeToggle.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
